<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Морг Святой Марии</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0d1214; --bg2:#121a1d; --panel:#172024; --panel2:#1d282c; --line:#29363b; --line2:#3a4b51;
  --text:#dde5e2; --muted:#8e9f9d; --faint:#62716f;
  --formalin:#8fb3ad; --parch:#ece3cd; --parch2:#e2d6b8; --ink:#2a231a; --ink2:#5a4c39;
  --blood:#c4382c; --blood-d:#7d1f18; --brass:#c9a45c; --ok:#6fae8a; --warn:#d9a23a;
  --display:"Old Standard TT", "Times New Roman", Georgia, serif;
  --serif:"PT Serif", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:6px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}

/* ---------- header ---------- */
header.top{display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:1px solid var(--line);background:linear-gradient(#131b1e,#0f1517);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand h1{font:700 21px/1.05 var(--display);margin:0;letter-spacing:.01em;white-space:nowrap}
.brand h1 i{font-weight:400;color:var(--brass)}
.brand small{font:11px var(--sans);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.hgap{flex:1}
.clockbox{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px}
.clockbox .t{font:500 18px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clockbox .left{font-size:11px;color:var(--muted);margin-right:4px;white-space:nowrap}
.clockbox .left.hot{color:var(--blood)}
.chip-btn{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:3px 9px;cursor:pointer;font-size:12px;white-space:nowrap}
.chip-btn:hover{border-color:var(--brass);color:#fff}
.marks{display:flex;gap:3px}
.mark{width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font:600 12px var(--mono);color:var(--muted)}
.mark.on{background:var(--blood-d);border-color:var(--blood);color:#fff}
.search{position:relative}
.search input{width:220px;max-width:44vw;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px 6px 30px;color:var(--text);font:13px var(--sans)}
.search svg{position:absolute;left:9px;top:8px;width:14px;height:14px;stroke:var(--muted)}
.results{position:absolute;right:0;top:calc(100% + 6px);width:min(420px,92vw);max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:0 14px 40px #000a;z-index:60;padding:4px}
.results button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:4px;cursor:pointer}
.results button:hover,.results button.act{background:var(--panel2)}
.results b{color:var(--brass);font-weight:500}
.results .ctx{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alertbadge{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--warn);cursor:pointer;background:none;border:1px solid #d9a23a55;border-radius:999px;padding:3px 10px}
.alertbadge .n{background:var(--warn);color:#1a1405;border-radius:999px;padding:0 6px;font-weight:600}

/* ---------- layout ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:0}
.mapwrap{position:relative;min-height:0;background:radial-gradient(ellipse at 50% 40%,#18211f 0%,#0b1011 70%);overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#map.panning{cursor:grabbing}
.room{fill:transparent;stroke:transparent;stroke-width:4;cursor:pointer;transition:fill .15s}
.room:hover{fill:#c9a45c22;stroke:#c9a45c88}
.room.threat{fill:#c4382c14}
.room.sel{fill:#c9a45c1f;stroke:var(--brass);stroke-width:7}
.room.visited:not(.sel):not(:hover){fill:#6fae8a0f}
.rlabel{pointer-events:none}
.rlabel rect{fill:#0d1214d9;stroke:#c9a45c66}
.rlabel text{fill:#ece3cd;font:600 30px var(--sans);letter-spacing:.02em}
.rlabel .num{fill:var(--brass);font:500 28px var(--mono)}
.visited-mark{fill:var(--ok);pointer-events:none}
.poi{cursor:pointer}
.poi circle.o{fill:#0d1214e6;stroke-width:3}
.poi.exit circle.o{stroke:#ece3cd}
.poi.item circle.o{stroke:var(--formalin)}
.poi.trap circle.o{stroke:var(--warn)}
.poi.npc circle.o{stroke:var(--brass)}
.poi path{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.poi.exit path{stroke:#ece3cd}.poi.item path{stroke:var(--formalin)}.poi.trap path{stroke:var(--warn)}.poi.npc path{stroke:var(--brass)}
.poi:hover circle.o{fill:#1d282c}
.tok{cursor:grab}
.tok .ring{stroke-width:5}
.tok text{font:700 40px var(--display);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tok .lab{font:600 22px var(--sans);fill:#ece3cd;paint-order:stroke;stroke:#0d1214;stroke-width:6px}
.tok.st0 .ring{stroke-dasharray:10 7}
.tok.st2 .ring{stroke:var(--warn)!important}
.tok.st3{opacity:.45}
.tok.st3 .x{display:inline}
.tok .x{display:none;stroke:#ece3cd;stroke-width:5}
.tok.regen .ring{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{stroke-width:12}}
.tok.dragging{cursor:grabbing}
#darkness{pointer-events:none;transition:opacity .6s}
.hidden-layer{display:none}

.mapctl{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:8px;z-index:5}
.seg{display:flex;background:#0d1214e6;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg button{background:none;border:0;padding:6px 10px;cursor:pointer;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 -2px 0 var(--brass)}
.seg.col{flex-direction:column}
.seg.col button{padding:6px 9px;font:500 16px var(--mono)}
.layers{background:#0d1214e6;border:1px solid var(--line2);border-radius:var(--r);padding:6px 10px;font-size:12px;display:flex;flex-direction:column;gap:3px}
.layers label{display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--muted)}
.layers input{accent-color:var(--brass)}
.legend{position:absolute;left:14px;bottom:14px;display:flex;gap:10px;flex-wrap:wrap;background:#0d1214e6;border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;font-size:11px;color:var(--muted);z-index:5;max-width:calc(100% - 28px)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;border:2px solid;display:inline-block}
.tip{position:fixed;z-index:80;pointer-events:none;background:#0d1214f2;border:1px solid var(--line2);border-radius:var(--r);padding:8px 10px;max-width:280px;font-size:12px;box-shadow:0 10px 30px #000a}
.tip b{font:700 15px var(--display);display:block;color:var(--parch)}
.tip .en{color:var(--faint);font-style:italic}
.tip .pt{color:var(--blood);font-weight:600}
.lightsout-banner{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--blood-d);color:#fff;border:1px solid var(--blood);padding:5px 14px;border-radius:999px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;z-index:6;cursor:pointer}

/* ---------- side panel ---------- */
aside{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--bg2)}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.tabs button{flex:1 1 auto;background:none;border:0;padding:10px 7px;cursor:pointer;color:var(--muted);font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--brass)}
.tabs button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:5px;vertical-align:middle}
.pane{flex:1;overflow:auto;padding:16px 18px 40px;scroll-behavior:smooth}
.pane h2{font:700 27px/1.1 var(--display);margin:0;text-wrap:balance}
.pane h3{font:700 17px var(--display);margin:22px 0 8px;color:var(--parch);display:flex;align-items:center;gap:8px}
.pane h3 .cnt{font:500 11px var(--mono);color:var(--muted)}
.pane h4{font:600 12px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.sub{color:var(--muted);font-size:12px;font-style:italic}
p{margin:0 0 8px}
.lead{color:#c5d0cd}
ul.plain{margin:0;padding-left:18px}
ul.plain li{margin:3px 0}
.rowbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:var(--r);padding:5px 10px;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--brass)}
.btn.pri{background:var(--blood-d);border-color:var(--blood);color:#fff}
.btn.good{border-color:#6fae8a88}
.btn.on{background:var(--panel2);border-color:var(--brass);color:#fff}
.btn.sm{padding:2px 8px;font-size:12px}

.read{background:var(--parch);color:var(--ink);border-radius:3px;padding:14px 16px 12px;font:15px/1.55 var(--serif);position:relative;margin:12px 0;box-shadow:0 1px 0 #fff4 inset,0 6px 20px #0006}
.read::before{content:"ЗАЧИТАТЬ";position:absolute;top:-9px;left:12px;background:var(--ink);color:var(--parch);font:600 10px var(--sans);letter-spacing:.14em;padding:2px 8px;border-radius:2px}
.read p{margin:0 0 8px}
.read .go{position:absolute;top:-11px;right:10px;border:1px solid var(--ink2);background:var(--parch2);color:var(--ink);font:600 11px var(--sans);border-radius:3px;padding:1px 8px;cursor:pointer}
.block{border-left:3px solid var(--line2);padding:2px 0 2px 12px;margin:8px 0}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.check .sk{grid-column:1/-1;font:600 12px var(--sans);color:var(--formalin)}
.check .tx{grid-column:1/-1;color:#cdd7d4;font-size:13px}
.trig{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.trig:last-child{border-bottom:0}
.trig::before{content:"";flex:none;width:8px;height:8px;margin-top:6px;background:var(--blood);transform:rotate(45deg)}
.exits{display:flex;flex-wrap:wrap;gap:6px}
.exit{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:3px 10px 3px 4px;cursor:pointer;font-size:12.5px;text-align:left}
.exit b{font:500 11px var(--mono);background:var(--panel2);border-radius:999px;padding:2px 6px;color:var(--brass)}
.exit:hover{border-color:var(--brass)}
.note{background:#c9a45c12;border:1px solid #c9a45c44;border-radius:var(--r);padding:8px 12px;font-size:13px;margin:10px 0}
.secret{background:#7d1f1822;border:1px solid #c4382c55;border-radius:var(--r);padding:10px 12px;font-size:13px}
.secret summary{cursor:pointer;color:#e88;font-weight:600}
.roomhead{display:flex;gap:12px;align-items:flex-start}
.roomhead .n{font:500 32px/1 var(--mono);color:var(--brass);border:1px solid var(--line2);border-radius:var(--r);padding:6px 8px;background:var(--panel)}
.roomnav{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-bottom:14px}
.roomnav button{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:5px 0;cursor:pointer;font:500 12px var(--mono);color:var(--muted);position:relative}
.roomnav button.on{border-color:var(--brass);color:#fff;background:var(--panel2)}
.roomnav button.vis::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--ok)}
.roomnav button.thr{box-shadow:inset 0 -2px 0 var(--blood)}

/* part cards */
.part{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:10px;overflow:hidden}
.part.focus{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.part .ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
.part .badge{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font:700 19px var(--display);border:3px solid}
.part .pn{font:700 18px var(--display);line-height:1.1}
.part .pl{font-size:12px;color:var(--muted)}
.part .pl a{color:var(--muted);cursor:pointer;text-decoration:underline dotted}
.stat{margin-left:auto;font:600 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid;white-space:nowrap}
.stat.s0{color:var(--muted);border-color:var(--line2)}
.stat.s1{color:#ff8a7d;border-color:var(--blood);background:#c4382c1c}
.stat.s2{color:var(--warn);border-color:var(--warn);background:#d9a23a1c}
.stat.s3{color:var(--ok);border-color:var(--ok);background:#6fae8a1c}
.part .pb{padding:0 12px 12px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-bottom:10px}
.steps button{border:1px solid var(--line);background:var(--bg2);border-radius:4px;padding:5px 2px;font-size:11.5px;cursor:pointer;color:var(--muted)}
.steps button.on{color:#fff;border-color:var(--brass);background:var(--panel2)}
.hp{display:grid;grid-template-columns:68px 1fr auto;gap:8px;align-items:center;margin:5px 0}
.hp .nm{font-size:12px;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:#0b1011;border:1px solid var(--line);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--blood-d),var(--blood));transition:width .2s}
.bar.zero{border-color:var(--warn)}
.hp .ctl{display:flex;align-items:center;gap:4px;font:500 13px var(--mono);font-variant-numeric:tabular-nums}
.hp .ctl button{width:24px;height:24px;border-radius:4px;border:1px solid var(--line2);background:var(--bg2);cursor:pointer;line-height:1}
.hp .ctl span{min-width:40px;text-align:center}
.regenrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;margin-top:8px;padding:6px 8px;border-radius:4px;background:#d9a23a14;border:1px dashed #d9a23a66}
.regenrow.due{background:#c4382c22;border-color:var(--blood);color:#ffb3aa;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{border-color:transparent}}
details.more{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
details.more summary{cursor:pointer;color:var(--formalin);font-size:12.5px;list-style:none}
details.more summary::before{content:"▸ "}
details.more[open] summary::before{content:"▾ "}
.statline{font:500 12px var(--mono);color:#c5d0cd;background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:6px 8px;margin:6px 0;line-height:1.6}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
table.t th{text-align:left;font:600 11px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line2);padding:5px 6px}
table.t td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top}
table.t td:first-child{color:var(--parch)}
.tscroll{overflow-x:auto}
.tscroll table.t{min-width:420px}

/* night */
.warns{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.warn{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:var(--r);background:#d9a23a14;border:1px solid #d9a23a55;font-size:13px;cursor:pointer}
.warn.crit{background:#c4382c1f;border-color:#c4382c88}
.warn .ic{flex:none;font:700 13px var(--mono);color:var(--warn)}
.warn.crit .ic{color:var(--blood)}
.clocklist{display:flex;flex-direction:column;gap:6px}
.cm{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left}
.cm .k{font:500 18px var(--mono);color:var(--muted);text-align:center;border-right:1px solid var(--line)}
.cm b{font:700 15px var(--display)}
.cm small{display:block;color:var(--muted);font-size:12px}
.cm.on{border-color:var(--blood);background:#7d1f1826}
.cm.on .k{color:var(--blood)}
.cm.past{opacity:.6}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tg{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--panel);cursor:pointer;text-align:left}
.tg small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tg b{font-weight:600;font-size:13.5px}
.tg.bad{border-color:#c4382c88;background:#7d1f181f}
.tg.bad b{color:#ff9d92}
.tg.good b{color:#9fd4b4}
.tg.mid b{color:var(--warn)}
.timebtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bigtime{font:500 38px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--formalin),var(--warn),var(--blood))}

/* investigators */
.inv{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:10px 12px;margin-bottom:8px}
.inv .top{display:flex;gap:8px;align-items:center}
.badge-inv{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid;display:grid;place-items:center;font:700 14px var(--display)}
.tok.inv .ring{stroke-width:4}
.inv input.name{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed var(--line2);color:var(--parch);font:700 16px var(--display);padding:2px 0}
.inv .sanbox{display:flex;align-items:center;gap:4px;font:500 15px var(--mono)}
.inv .sanbox input{width:48px;background:var(--bg2);border:1px solid var(--line2);border-radius:4px;color:var(--text);font:500 15px var(--mono);text-align:center;padding:2px}
.inv .met{display:flex;gap:4px;margin:8px 0 6px;flex-wrap:wrap}
.inv .met button{border:2px solid var(--line2);background:var(--bg2);border-radius:999px;padding:1px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.inv .met button.on{color:#fff}
.inv .calc{font-size:12.5px;color:#c5d0cd}
.inv .calc b{font:500 13px var(--mono);color:var(--brass)}
.ctr{display:inline-flex;align-items:center;gap:3px;font:500 12px var(--mono)}
.ctr button{width:20px;height:20px;border-radius:3px;border:1px solid var(--line2);background:var(--bg2);cursor:pointer;line-height:1;padding:0}
.dice{display:flex;gap:4px;flex-wrap:wrap}
.dice button{border:1px solid var(--line2);background:var(--panel);border-radius:4px;padding:5px 8px;font:500 12px var(--mono);cursor:pointer}
.dice button:hover{border-color:var(--brass)}
.dlog{font:500 13px var(--mono);color:var(--muted);margin-top:6px;min-height:20px}
.dlog b{color:var(--parch);font-size:17px}

/* scenes */
.scene{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:8px}
.scene>summary{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;list-style:none}
.scene>summary::-webkit-details-marker{display:none}
.scene .sn{font:500 13px var(--mono);color:var(--brass);border:1px solid var(--line2);border-radius:4px;padding:2px 7px}
.scene .st{font:700 16px var(--display);flex:1}
.scene .tm{font:500 11px var(--mono);color:var(--muted)}
.scene .body{padding:0 12px 12px}
.scene[open]{border-color:var(--line2)}
.next{font-size:12.5px;color:var(--formalin);margin-top:8px}
.next::before{content:"→ "}
.cl label{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13px;cursor:pointer}
.cl input{accent-color:var(--brass);margin-top:3px}
.cl label.done span{color:var(--faint);text-decoration:line-through}
.cl .auto{font-size:11px;color:var(--formalin);margin-left:4px}

/* modal */
.modal{position:fixed;inset:0;z-index:100;background:#05080ae6;display:grid;place-items:center;padding:24px 16px;overflow:auto}
.modal .sheet{position:relative;max-width:760px;width:100%}
.modal .close{position:absolute;top:-6px;right:-6px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-size:18px;z-index:2}
.reading{background:var(--parch);color:var(--ink);padding:36px 40px;border-radius:3px;font:clamp(18px,2.2vw,24px)/1.6 var(--serif);box-shadow:0 30px 80px #000}
.reading h5{font:700 13px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);margin:0 0 14px}
.reading p{margin:0 0 14px}
.news{background:#e8dfc6;color:#1f1a12;padding:30px 36px;font-family:var(--serif);box-shadow:0 30px 80px #000;border-radius:2px}
.news .mast{font:700 clamp(28px,4vw,44px)/1 var(--display);text-align:center;border-bottom:3px double #1f1a12;padding-bottom:8px}
.news .date{text-align:center;font:italic 13px var(--serif);border-bottom:1px solid #1f1a12;padding:4px 0;margin-bottom:16px}
.news h6{font:700 clamp(20px,2.6vw,28px)/1.15 var(--display);margin:0 0 12px;text-align:center}
.news p{font-size:clamp(16px,1.8vw,19px);line-height:1.55;text-align:justify;hyphens:auto;margin:0 0 10px}
.notebook{background:repeating-linear-gradient(#f3ecd8 0 31px,#b9c9d6 31px 32px);color:#2a3440;padding:34px 36px 30px 64px;position:relative;box-shadow:0 30px 80px #000;border-radius:2px;font:italic clamp(18px,2vw,22px)/32px var(--serif)}
.notebook::before{content:"";position:absolute;left:44px;top:0;bottom:0;width:2px;background:#d38a8a}
.notebook h6{font:700 clamp(19px,2.2vw,24px)/32px var(--serif);margin:0 0 32px;font-style:normal}
.notebook p{margin:0 0 32px}
.notebook p:last-child{font-weight:700;color:#7d1f18}
.keepernote{margin-top:14px;font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:10px 12px;border-radius:var(--r)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--brass);padding:8px 16px;border-radius:999px;z-index:120;font-size:13px;box-shadow:0 10px 30px #000a}
kbd{font:500 11px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--muted)}

@media (max-width: 980px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:1fr}
  .mapwrap{height:62vh;min-height:340px}
  aside{border-left:0;border-top:1px solid var(--line)}
  .pane{overflow:visible}
  .brand h1{font-size:18px}
  .layers{display:none}
}
@media (max-width: 560px){
  header.top{gap:8px}
  .marks{display:none}
  .search input{width:150px}
  .reading,.news{padding:22px 20px}
  .notebook{padding:24px 18px 20px 46px}
  .notebook::before{left:30px}
  .toggles{grid-template-columns:1fr}
  .legend{display:none}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  .pane{scroll-behavior:auto}
}
</style>

</head>

    read: ["Тела регулярно доставляют сюда на лифте, соединённом с больницей. У одной стены в ряд стоят три стальные каталки на колёсах с тормозами. Вдоль стены тянется длинная столешница с рядом шкафов над ней. В одном углу стоит передвижной аппарат для бальзамирования; в другом — большая раковина и стальная ванна."],
    why: "Соединение между лифтом больницы и коридором. Персонал доставляет сюда тела. Сыщики могут проверить второй вход, взять каталку или решить, стоит ли звать помощь наверх.",
    actions: ["Проверить лифт и понять, можно ли подняться к персоналу.", "Использовать каталки как укрытие, преграду или способ переместить обездвиженную часть.", "Проследить кровяной след в сторону коридора.", "Позвать медсестру: она может помочь Уорвику, но появление персонала осложнит скрытность."],
    checks: [
      ["Электрика (Electrical Repair)", "Успех открывает панель вызова лифта или определяет, что кабина стоит этажом выше. Провал: лифт не отвечает, но можно воспользоваться служебным выходом."],
      ["Механика / Слесарное дело", "Успех временно блокирует лифт или открывает его двери. Провал — громкий скрежет, слышимый в коридоре."],
      ["Наблюдательность (Spot Hidden)", "След крови ведёт к коридору, качающаяся каталка двигалась недавно. Провал: каталка продолжает раскачиваться и выдаёт звук при следующем шуме."],
      ["Сила (STR)", "Каталка как импровизированный щит или тележка для обездвиженной части; бросок только под давлением."]

    triggers: ["Вызов лифта или стук по створкам привлекает внимание частей; при активной угрозе одна может пересечь коридор.", "Если группу заметил персонал, медсестра требует объяснить кровь и присутствие в закрытом подвале.", "При пожаре лифт становится путём эвакуации пациентов, а не способом незаметно уйти."],

    why: "Навигационный центр морга: здесь группа выбирает, куда идти, может услышать части и заметить след Внутренностей. Дверь в холодильную камеру — из кабинета администрации.",
    actions: ["Выбрать маршрут: коридор связывает почти все помещения и служебную дверь наружу.", "Прислушаться к частям и заметить пятно на потолке.", "Выманить Внутренности из потолочной полости."],

      ["Наблюдательность, предельная", "Капля крови на полу или изменение цвета потолочной плитки. После двух найденных частей — **сложная**; после всех частей — **обычная**."],
      ["Слух (Listen)", "Если Уорвика оставили одного: приглушённый крик из зала вскрытия (01)."],

      ["Скрытность (Stealth)", "Пересечь коридор, не выдавая маршрут частям или полицейскому. Провал: одна угроза меняет позицию."],
      ["Наблюдательность / Выживание", "Связать кровавые дорожки с дверями комнат; провал добавляет задержку, но двери и шумы остаются зацепками."]

  react:[["Тихо исследуют","Шанс услышать части и подготовить захват; не продвигайте часы за осторожность."],["Долго медлят","Части меняют позиции, Руки гасят свет, Голова звонит; ближе к 9:00 — сотрудники."],["Шумят или применяют насилие","Части используют суматоху; персонал или патрульный проверяют подвал; открытый выход — побег."]],
  secret:"Все пять частей принадлежат Оливеру Кларку, культисту, который мумифицировал себя в ходе обряда, связанного с Ньярлатхотепом. Предыстория необязательна: оставьте личность неясной или замените врагом из прошлого сыщиков. Главный выбор — как остановить угрозу и какую цену сыщики готовы заплатить.",
  principle:"Провал проверки меняет цену, шум, время или позицию, но не должен отрезать последнюю дорогу к цели."
};

const CHECKLIST = [
  ["До игры",["Решить, кем сыщики приходятся Уорвику и почему откликнулись","Согласовать границы: расчленение, кровь, травмы, пожар, безумие","Подготовить карту морга и хендауты","Решить, кто такой Оливер Кларк (или оставить неизвестным)","Определить, сколько игрового времени до 9:00"]],
  ["Начало",["Спросить каждого, почему его сыщик ответил на звонок","Дать несколько путей к адресу морга","SAN 0/1 при виде умирающего Уорвика","Объяснить, что нужно остановить все пять групп"]],
  ["Во время охоты",["Часть без присмотра 5 минут — +1D4 HP","Пока Руки свободны — признаки саботажа света/печи","Голова дозвонилась — реакция оператора и время патруля","Группа разделилась — не пора ли Внутренностям? Уорвик один?","Сигналы приближения полиции и смены","Полицейский видит нападение — SAN 1/1D6"]],
  ["Финал",["Все пять групп уничтожены окончательно, а не только 0 HP","Сжигают всё разом — Удача наименьшего","9:00 — прибытие утренней смены","Судьба Уорвика, последствия для больницы, эпилог"]]
];

const TIMELINE = [["Звонок и знакомство","10"],["Квартира и улики","25"],["Больница и вход","15"],["Раненый Уорвик","25"],["Охота по моргу","95"],["Последняя часть и побег","20"],["Эпилог","10"]];

</script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const NS="http://www.w3.org/2000/svg";
const PARTY_COL=["#6fae8a","#7fb8d9","#e0c872","#c79ad9"];
const ORDER=["01","02","03","04","05","06","07","08","09","10"];
const PART=Object.fromEntries(PARTS.map(p=>[p.id,p]));
const STATUS=["Скрыта","Обнаружена","Обездвижена","Уничтожена"];
const START_T=23*60+30, DEADLINE=24*60+9*60;
const obs=f=>"obsidian://open?vault="+encodeURIComponent(VAULT)+"&file="+encodeURIComponent(BASE+f);

/* ---------- state ---------- */
const KEY="bp-morgue-map-v1";
function fresh(){
  const parts={};
  PARTS.forEach(p=>parts[p.id]={status:0,hp:p.limbs.map(l=>l[1]),room:p.room,pos:p.pos.slice(),restAt:null,watched:false});
  return {view:"orig",room:"01",tab:"room",parts,visited:{},mark:0,time:START_T,
    tokens:{warwick:[1120,1070],party1:[1905,395],party2:[1905,490],party3:[1905,705],party4:[1905,800],police:null},
    night:{light:true,furnace:false,armsFree:true,door:"closed",lift:"locked",call:"none",policeAt:null,warwick:"dying",alone:false,fire:false},
    inv:[1,2,3,4].map(n=>({name:"Сыщик "+n,san:50,lp:0,lv:0,met:{}})),
    cl:{},layers:{tokens:true,pois:true,labels:false},focusPart:null};
}
let S=fresh();
try{const raw=localStorage.getItem(KEY); if(raw){const o=JSON.parse(raw); S=Object.assign(fresh(),o); S.night=Object.assign(fresh().night,o.night||{}); S.tokens=Object.assign(fresh().tokens,o.tokens||{});delete S.tokens.party; PARTS.forEach(p=>{if(!S.parts[p.id])S.parts[p.id]=fresh().parts[p.id]});}}catch(e){}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},150)}

/* ---------- utils ---------- */
const fmt=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const dur=m=>{if(m<=0)return "0 мин";const h=Math.floor(m/60),mm=m%60;return (h?h+" ч ":"")+(mm?mm+" мин":"").trim()};
const roll=n=>1+Math.floor(Math.random()*n);
function toast(t){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";document.body.appendChild(el)}el.innerHTML=t;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,2600)}
function inPoly(x,y,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const [xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}
function roomAt(x,y){const order=["01","02","04","05","06","07","08","09","10","03"];for(const id of order)if(inPoly(x,y,ROOMS[id].poly))return id;return null}
function partsIn(room){return PARTS.filter(p=>S.parts[p.id].room===room&&S.parts[p.id].status<3)}
const foundCount=()=>PARTS.filter(p=>S.parts[p.id].status>0).length;

/* ---------- map ---------- */
const svg=$("#map");
let vb={x:-60,y:-60,w:2120,h:1685};
const FIT={x:-60,y:-60,w:2120,h:1685}, PAGE={x:-260,y:-700,w:2450,h:3150};
function setVB(){svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)}
function fitTo(r){const W=svg.clientWidth||800,H=svg.clientHeight||600,ar=W/H;let w=r.w,h=r.h;if(w/h<ar)w=h*ar;else h=w/ar;vb={x:r.x-(w-r.w)/2,y:r.y-(h-r.h)/2,w,h};setVB()}
function zoomAt(f,cx,cy){if(cx==null){cx=vb.x+vb.w/2;cy=vb.y+vb.h/2}const nw=Math.min(Math.max(vb.w/f,300),5200),k=nw/vb.w;vb={x:cx-(cx-vb.x)*k,y:cy-(cy-vb.y)*k,w:nw,h:vb.h*k};setVB()}
function pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function el(tag,attrs,parent){const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n}

function buildRooms(){
  const g=$("#gRooms"),gl=$("#gLabels");
  for(const id in ROOMS){const r=ROOMS[id];
    el("polygon",{points:r.poly.map(p=>p.join(",")).join(" "),class:"room","data-room":id,id:"poly"+id},g);
    const lg=el("g",{class:"rlabel",transform:`translate(${r.label[0]},${r.label[1]})`},gl);
    const w=r.name.length*16+80;
    el("rect",{x:-w/2,y:-24,width:w,height:48,rx:24},lg);
    const t1=el("text",{x:-w/2+22,y:10,class:"num"},lg);t1.textContent=id;
    const t2=el("text",{x:-w/2+68,y:10},lg);t2.textContent=r.name;
  }
}
const ICONS={exit:"M-10 -12h14v24h-14 M4 0h10 M10 -5l5 5-5 5",item:"M-9 -9h18v18h-18z M-4 0h8",trap:"M0 -12l12 21h-24z M0 -3v6 M0 6.5v.5",npc:"M0 -6a5 5 0 1 0 .1 0 M-10 12c2-8 18-8 20 0"};
function buildPois(){
  const g=$("#gPois");g.innerHTML="";
  POIS.forEach(p=>{const pg=el("g",{class:"poi "+p.kind,transform:`translate(${p.x},${p.y})`,"data-poi":p.id,tabindex:0},g);
    el("circle",{r:22,class:"o"},pg);el("path",{d:ICONS[p.kind]},pg);});
}
function tokenStatus(id){return S.parts[id].status}
function renderTokens(){
  const g=$("#gTokens");g.innerHTML="";
  const addTok=(key,x,y,letter,color,label,cls)=>{
    const tg=el("g",{class:"tok "+(cls||""),transform:`translate(${x},${y})`,"data-tok":key,tabindex:0},g);
    el("circle",{r:34,fill:"#0d1214",opacity:.35,cy:5},tg);
    el("circle",{r:30,class:"ring",fill:"#0d1214",stroke:color},tg);
    const t=el("text",{fill:color,y:1},tg);t.textContent=letter;
    el("path",{class:"x",d:"M-20 -20L20 20M20 -20L-20 20"},tg);
    const l=el("text",{class:"lab",y:56},tg);l.textContent=label;
    return tg;
  };
  PARTS.forEach(p=>{const st=S.parts[p.id];const due=regenDue(p.id);
    addTok(p.id,st.pos[0],st.pos[1],p.short,p.color,p.name,"st"+st.status+(due?" regen":""))});
  const w=S.night.warwick;
  addTok("warwick",S.tokens.warwick[0],S.tokens.warwick[1],"У",w==="dead"?"#62716f":"#ece3cd","Уорвик",w==="dead"?"st3":"");
  PARTY_COL.forEach((c,i)=>{const k="party"+(i+1),p=S.tokens[k];if(p)addTok(k,p[0],p[1],String(i+1),c,(S.inv[i]&&S.inv[i].name)||("Сыщик "+(i+1)),"inv")});
  if(S.tokens.police)addTok("police",S.tokens.police[0],S.tokens.police[1],"П","#7aa7e0","Полицейский","");
}
function renderMap(){
  $("#imgOrig").style.display=S.view==="orig"?"":"none";
  $("#imgPlan").style.display=S.view==="plan"?"":"none";
  $("#vOrig").classList.toggle("on",S.view==="orig");$("#vPlan").classList.toggle("on",S.view==="plan");
  for(const id in ROOMS){const p=$("#poly"+id);p.classList.toggle("sel",S.room===id);p.classList.toggle("visited",!!S.visited[id]);p.classList.toggle("threat",partsIn(id).length>0)}
  $("#gTokens").classList.toggle("hidden-layer",!S.layers.tokens);
  $("#gPois").classList.toggle("hidden-layer",!S.layers.pois);
  $("#gLabels").classList.toggle("hidden-layer",!S.layers.labels);
  $("#lTokens").checked=S.layers.tokens;$("#lPois").checked=S.layers.pois;$("#lLabels").checked=S.layers.labels;
  $("#darkness").setAttribute("opacity",S.night.light?0:1);
  $("#loBanner").hidden=S.night.light;
  renderTokens();
}

/* pointer: pan, pinch, drag tokens, click rooms */
const ptrs=new Map();let drag=null,pinch=null;
svg.addEventListener("pointerdown",e=>{
  svg.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  hideTip();
  if(ptrs.size===2){drag=null;const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};return}
  const tok=e.target.closest(".tok"),poi=e.target.closest(".poi"),room=e.target.closest(".room");
  const p=pt(e);
  if(tok){const key=tok.dataset.tok;const cur=key in S.parts?S.parts[key].pos:S.tokens[key];drag={mode:"tok",key,el:tok,off:[p.x-cur[0],p.y-cur[1]],sx:e.clientX,sy:e.clientY,moved:false};tok.classList.add("dragging");}
  else drag={mode:"pan",sx:e.clientX,sy:e.clientY,vb0:{...vb},moved:false,poi:poi&&poi.dataset.poi,room:room&&room.dataset.room,pp:p};
});
svg.addEventListener("pointermove",e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const mid=pt({clientX:(a.x+b.x)/2,clientY:(a.y+b.y)/2});zoomAt(d/pinch.d,mid.x,mid.y);pinch.d=d;return}
  if(!drag){hover(e);return}
  const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.hypot(dx,dy)>4)drag.moved=true;
  if(drag.mode==="pan"&&drag.moved){svg.classList.add("panning");const k=vb.w/svg.clientWidth;vb.x=drag.vb0.x-dx*k;vb.y=drag.vb0.y-dy*k;setVB()}
  if(drag.mode==="tok"&&drag.moved){const p=pt(e);const x=p.x-drag.off[0],y=p.y-drag.off[1];drag.el.setAttribute("transform",`translate(${x},${y})`);drag.cur=[x,y]}
});
function endPtr(e){
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(!drag)return;const d=drag;drag=null;svg.classList.remove("panning");
  if(d.mode==="tok"){d.el.classList.remove("dragging");
    if(d.moved&&d.cur){const r=roomAt(d.cur[0],d.cur[1]);
      if(d.key in S.parts){S.parts[d.key].pos=d.cur;if(r){const was=S.parts[d.key].room;S.parts[d.key].room=r;if(r!==was)toast(`${PART[d.key].name} → ${r} ${ROOMS[r].name}`)}}
      else S.tokens[d.key]=d.cur;
      save();renderMap();refreshPane();}
    else openToken(d.key);
    return}
  if(!d.moved){if(d.poi)openPoi(d.poi);else if(d.room)selectRoom(d.room);}
}
svg.addEventListener("pointerup",endPtr);svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("wheel",e=>{e.preventDefault();const p=pt(e);zoomAt(e.deltaY<0?1.15:1/1.15,p.x,p.y)},{passive:false});
svg.addEventListener("pointerleave",hideTip);
svg.addEventListener("keydown",e=>{if(e.key==="Enter"){const t=e.target.closest(".tok,.poi");if(t){t.dataset.tok?openToken(t.dataset.tok):openPoi(t.dataset.poi)}}});

const tip=$("#tip");
function hideTip(){tip.hidden=true}
function hover(e){
  const tok=e.target.closest&&e.target.closest(".tok"),poi=e.target.closest&&e.target.closest(".poi"),room=e.target.closest&&e.target.closest(".room");
  let h="";
  if(tok){const k=tok.dataset.tok;if(PART[k]){const p=PART[k],s=S.parts[k];h=`<b>${p.name}</b><span class="pt">${STATUS[s.status]}</span> · HP ${s.hp.join(" / ")}<br>${esc(p.goal)}`}else if(/^party/.test(k)){const i=+k.slice(5)-1,v=S.inv[i];h=`<b>${esc(v?v.name:"Сыщик "+(i+1))}</b>${v?"SAN "+v.san+" · ":""}Перетащите жетон; щелчок — карточка сыщика`}
  else h=`<b>${{warwick:"Лоуренс Уорвик",party:"Сыщики",police:"Полицейский"}[k]}</b>Перетащите жетон; щелчок — карточка`}
  else if(poi){const p=POIS.find(x=>x.id===poi.dataset.poi);h=`<b>${esc(p.name)}</b>${md(p.text)}`}
  else if(room){const r=ROOMS[room.dataset.room];const ps=partsIn(room.dataset.room).map(p=>p.name);h=`<b>${r.num} · ${esc(r.name)}</b><span class="en">${esc(r.en)}</span>${ps.length?`<br><span class="pt">Здесь: ${ps.join(", ")}</span>`:""}${S.visited[room.dataset.room]?"<br>✓ посещено":""}`}
  if(!h){hideTip();return}
  tip.innerHTML=h;tip.hidden=false;
  const x=Math.min(e.clientX+16,innerWidth-300),y=Math.min(e.clientY+16,innerHeight-tip.offsetHeight-10);
  tip.style.left=x+"px";tip.style.top=y+"px";
}

/* ---------- navigation ---------- */
function selectRoom(id,noTab){S.room=id;if(!noTab)S.tab="room";save();renderMap();renderTabs();renderPane();$("#pane").scrollTop=0}
function openToken(k){if(PART[k]){S.focusPart=k;S.tab="parts";save();renderTabs();renderPane();setTimeout(()=>{const c=document.getElementById("pc-"+k);if(c)c.scrollIntoView({block:"start"})},30)}else if(k==="warwick"){S.tab="story";save();renderTabs();renderPane();setTimeout(()=>{const c=document.getElementById("warwick");if(c){c.open=true;c.scrollIntoView({block:"start"})}},30)}else if(/^party/.test(k)){S.tab="party";save();renderTabs();renderPane();setTimeout(()=>{const c=document.getElementById("inv-"+(+k.slice(5)-1));if(c){c.scrollIntoView({block:"start"});c.animate([{borderColor:"#c9a45c"},{borderColor:"#29363b"}],{duration:1400})}},30)}else if(k==="police"){S.tab="rules";save();renderTabs();renderPane();setTimeout(()=>{const c=document.getElementById("r-police");if(c)c.scrollIntoView({block:"start"})},30)}else{S.tab="night";save();renderTabs();renderPane()}}
function openPoi(id){const p=POIS.find(x=>x.id===id);selectRoom(p.room);setTimeout(()=>{const c=document.getElementById("poi-"+id);if(c){c.scrollIntoView({block:"center"});c.animate([{background:"#c9a45c44"},{background:"transparent"}],{duration:1400})}},30)}

/* ---------- regen & warnings ---------- */
function regenDue(id){const s=S.parts[id];return s.status===2&&s.restAt!=null&&!s.watched&&S.time-s.restAt>=5}
function warnings(){
  const w=[];const n=S.night;
  PARTS.forEach(p=>{if(regenDue(p.id))w.push({c:1,t:`${p.name}: 5+ минут без присмотра — восстанавливает 1D4 HP`,go:"parts",part:p.id})});
  if(n.warwick!=="dead"&&n.alone)w.push({c:1,t:"Уорвик оставлен один — Внутренности могут напасть (Слух: приглушённый крик из 01)",go:"night"});
  if(n.warwick==="dying")w.push({c:1,t:"Уорвик истекает кровью: Первая помощь / Медицина, иначе умрёт",go:"room",room:"01"});
  if(S.parts.head.status<2&&n.call==="none")w.push({c:0,t:"Голова у телефона — может дозвониться до полиции",go:"room",room:"04"});
  if(n.call==="called"&&n.policeAt!=null){const left=n.policeAt-S.time;w.push({c:left<=10?1:0,t:left>0?`Патруль прибудет в ${fmt(n.policeAt)} (через ${dur(left)})`:"Патрульный у служебного входа!",go:"rules",anchor:"r-police"})}
  if(S.parts.arms.status<2&&n.armsFree)w.push({c:0,t:"Руки свободны — могут отключить свет или печь (подайте знак: мигание ламп)",go:"room",room:"06"});
  if(n.door==="open")w.push({c:1,t:"Задняя дверь открыта — части могут прорваться наружу",go:"night"});
  if(n.fire)w.push({c:1,t:"Пожар! Угроза больнице и пациентам; лифт — путь эвакуации",go:"night"});
  const left=DEADLINE-S.time;if(left<=60&&left>0)w.push({c:1,t:`До утренней смены ${dur(left)}`,go:"night"});else if(left<=0)w.push({c:1,t:"9:00 — утренняя смена открывает морг",go:"story",anchor:"s-end"});
  const alive=PARTS.filter(p=>S.parts[p.id].status<3);
  if(alive.length===1&&alive[0].id==="torso")w.push({c:0,t:"Торс остался последним — подчеркните нехватку времени; Внутренности могут вмешаться",go:"parts",part:"torso"});
  if(alive.length===1&&alive[0].id!=="torso")w.push({c:0,t:`Осталась одна группа (${alive[0].name}) — сцена 6: выберите одно осложнение`,go:"story",anchor:"s6"});
  if(alive.length===0)w.push({c:0,t:"Все части уничтожены — финальное зачитывание и эпилог",go:"story",anchor:"s-end"});
  return w;
}

/* ---------- header ---------- */
function renderHeader(){
  $("#hTime").textContent=fmt(S.time);
  const left=DEADLINE-S.time;const hl=$("#hLeft");hl.textContent=left>0?"до 9:00 · "+dur(left):"смена пришла";hl.classList.toggle("hot",left<=60);
  $("#marks").innerHTML=CLOCK.map((c,i)=>`<button class="mark ${S.mark>i?"on":""}" data-act="mark" data-v="${i+1}" title="${esc(c[0])}">${i+1}</button>`).join("");
  const w=warnings();$("#alertBadge").hidden=!w.length;$("#alertN").textContent=w.length;
}
function renderTabs(){document.querySelectorAll("#tabs button").forEach(b=>{b.classList.toggle("on",b.dataset.tab===S.tab);b.innerHTML=b.textContent.replace(/\s*$/,"")+(b.dataset.tab==="night"&&warnings().some(x=>x.c)?'<span class="dot"></span>':"")})}

/* ---------- pane renderers ---------- */
const readBlock=(paras,title)=>`<div class="read"><button class="go" data-act="read" data-title="${esc(title||"")}" data-text="${esc(JSON.stringify(paras))}">⛶ крупно</button>${paras.map(p=>`<p>${md(p)}</p>`).join("")}</div>`;
const checkList=arr=>`<div class="checks">${arr.map(c=>`<div class="check">${c[0]?`<span class="sk">${esc(c[0])}</span>`:""}<span class="tx">${md(c[1])}</span></div>`).join("")}</div>`;
const trigList=arr=>arr.map(t=>`<div class="trig"><span>${md(t)}</span></div>`).join("");
const exitName=id=>ROOMS[id]?ROOMS[id].name:(POIS.find(p=>p.id===id)||{}).name||id;

function paneRoom(){
  const r=ROOMS[S.room],id=S.room;
  const nav=ORDER.map(k=>`<button class="${k===id?"on":""} ${S.visited[k]?"vis":""} ${partsIn(k).length?"thr":""}" data-act="room" data-v="${k}" title="${esc(ROOMS[k].name)}">${k}</button>`).join("");
  const ps=partsIn(id);
  const partHtml=ps.map(p=>{const s=S.parts[p.id];return `<div class="part" style="margin-top:12px"><div class="ph"><div class="badge" style="border-color:${p.color};color:${p.color}">${p.short}</div><div><div class="pn">${p.name}</div><div class="pl">${esc(p.goal)}</div></div><span class="stat s${s.status}">${STATUS[s.status]}</span></div><div class="pb">
    ${s.status===0?readBlock([p.appear],"Появление: "+p.name):""}
    <div class="rowbtns">${s.status===0?`<button class="btn pri" data-act="found" data-v="${p.id}">Обнаружена — SAN</button>`:""}<button class="btn" data-act="gopart" data-v="${p.id}">Трекер и характеристики →</button></div></div></div>`}).join("");
  const others=r.partAlt?`<div class="note">Ноги могут прятаться здесь или пробегать через эту комнату. Основное укрытие — комната отдыха (08).</div>`:"";
  const pois=POIS.filter(p=>p.room===id).map(p=>`<div class="check" id="poi-${p.id}"><span class="sk">${esc(p.name)}</span><span class="tx">${md(p.text)}</span></div>`).join("");
  const staff=r.shared==="staff";
  const checks=staff?STAFF_SHARED.checks:(r.checks||[]);
  const trig=staff?STAFF_SHARED.triggers:(r.triggers||[]);
  const extra=id==="01"?`<div class="rowbtns"><button class="btn" data-act="wstate" data-v="stable">Уорвик стабилизирован</button><button class="btn" data-act="wstate" data-v="dead">Уорвик погиб</button><button class="btn" data-act="gowarwick">Карточка Уорвика</button></div>`:"";
  return `<div class="roomnav">${nav}</div>
  <div class="roomhead"><div class="n">${r.num}</div><div style="flex:1;min-width:0"><div class="eyebrow">${esc(r.tag||"Помещение")}</div><h2>${esc(r.name)}</h2><div class="sub">На оригинале: ${esc(r.en)}</div></div></div>
  <div class="rowbtns"><button class="btn ${S.visited[id]?"on":""}" data-act="visit">${S.visited[id]?"✓ Посещено":"Отметить посещённой"}</button><a class="btn" href="${obs(r.file)}">Открыть в Obsidian</a><button class="btn" data-act="center">Показать на карте</button></div>
  ${staff?`<p class="lead" style="margin-top:12px">${esc(STAFF_SHARED.intro)}</p>`:""}
  ${readBlock(r.read,r.num+" · "+r.name)}
  ${partHtml}${others}
  <h3>Зачем сыщики здесь</h3><p class="lead">${md(r.why)}</p>
  <h4>Что можно сделать</h4><ul class="plain">${r.actions.map(a=>`<li>${md(a)}</li>`).join("")}</ul>
  ${extra}
  ${r.note?`<div class="note">${md(r.note)}</div>`:""}
  ${pois?`<h3>Объекты на карте</h3><div class="checks">${pois}</div>`:""}
  <h3>Проверки${staff?' <span class="cnt">общие для 07–09</span>':""}</h3>${checkList(checks)}
  <h3>Триггеры и опасность</h3>${trigList(trig)}
  <h3>Выходы</h3><div class="exits">${r.exits.map(([k,t])=>`<button class="exit" data-act="${ROOMS[k]?"room":"poi"}" data-v="${k}"><b>${ROOMS[k]?k:"↗"}</b>${esc(t)}</button>`).join("")}</div>`;
}

function hpRows(p){const s=S.parts[p.id];return p.limbs.map((l,i)=>`<div class="hp"><span class="nm">${l[0]}</span><div class="bar ${s.hp[i]===0?"zero":""}"><i style="width:${s.hp[i]/l[1]*100}%"></i></div><span class="ctl"><button data-act="hp" data-p="${p.id}" data-i="${i}" data-v="-1" aria-label="Урон">−</button><span>${s.hp[i]}/${l[1]}</span><button data-act="hp" data-p="${p.id}" data-i="${i}" data-v="1" aria-label="Лечение">+</button></span></div>`).join("")}
function partCard(p){
  const s=S.parts[p.id];const due=regenDue(p.id);
  const regen=s.status===2?`<div class="regenrow ${due?"due":""}">${s.watched?"Под присмотром — не восстанавливается":due?`<b>Восстановление!</b> Покой с ${fmt(s.restAt)}`:`Покой с ${fmt(s.restAt)} · восстановится в ${fmt(s.restAt+5)}`}
    <span style="margin-left:auto;display:flex;gap:4px"><button class="btn sm ${s.watched?"on":""}" data-act="watch" data-v="${p.id}">${s.watched?"Под присмотром":"Без присмотра"}</button>${due?`<button class="btn sm pri" data-act="regen" data-v="${p.id}">+1D4 HP</button>`:""}</span></div>`:"";
  return `<div class="part ${S.focusPart===p.id?"focus":""}" id="pc-${p.id}"><div class="ph"><div class="badge" style="border-color:${p.color};color:${p.color}">${p.short}</div><div style="min-width:0"><div class="pn">${p.name}</div><div class="pl">Сейчас: <a data-act="room" data-v="${s.room}">${s.room} ${esc(ROOMS[s.room].name)}</a>${s.room!==p.room?` · начало: ${p.room}`:""}</div></div><span class="stat s${s.status}">${STATUS[s.status]}</span></div>
  <div class="pb"><div class="steps">${STATUS.map((t,i)=>`<button class="${s.status===i?"on":""}" data-act="status" data-p="${p.id}" data-v="${i}">${t}</button>`).join("")}</div>
  ${hpRows(p)}${regen}
  <div class="rowbtns"><button class="btn sm" data-act="regenany" data-v="${p.id}">+1D4 HP</button><button class="btn sm" data-act="dmg" data-v="${p.id}">Урон…</button>${s.status<3?`<button class="btn sm good" data-act="status" data-p="${p.id}" data-v="3">Уничтожить</button>`:""}</div>
  <details class="more"><summary>Появление, тактика, характеристики</summary>
    ${readBlock([p.appear],"Появление: "+p.name)}
    <p><b>Цель:</b> ${esc(p.goal)}. <b>Знает:</b> ${esc(p.knows)}. <b>Реакция:</b> ${esc(p.react)}.</p>
    <p>${md(p.tactics)}</p>
    <div class="statline">${p.stats}<br>${p.derived}</div>
    <ul class="plain">${p.attacks.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>
    <p style="margin-top:6px">${md(p.skills)}</p>
    <div class="note">${md(p.special)}</div>
    <div class="tscroll"><table class="t"><tr><th>Действие</th><th>Проверка</th><th>Успех</th><th>Провал / цена</th></tr>${p.checks.map(c=>`<tr>${c.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</table></div>
  </details></div></div>`;
}
function paneParts(){
  const n=PARTS.filter(p=>S.parts[p.id].status===3).length;
  const pct=n/5*100;
  return `<div class="eyebrow">Охота</div><h2>Пять групп частей</h2>
  <p class="lead" style="margin-top:6px">Уничтожено <b>${n} из 5</b>. При 0 HP часть обездвижена; через 5 минут покоя возвращает 1D4 HP. Время покоя считается по игровым часам.</p>
  <div class="progress"><i style="width:${pct}%"></i></div>
  <div style="margin-top:14px">${PARTS.map(partCard).join("")}</div>`;
}

function paneNight(){
  const n=S.night,w=warnings();const left=DEADLINE-S.time;const span=DEADLINE-START_T;
  const tg=(key,label,val,cls)=>`<button class="tg ${cls}" data-act="tg" data-v="${key}"><small>${label}</small><b>${val}</b></button>`;
  const wmap={dying:["Умирает","bad"],stable:["Стабилизирован","good"],dead:["Погиб","mid"],upstairs:["Унесён наверх","good"]};
  const callmap={none:["Нет","good"],called:["Полиция вызвана","bad"],calm:["Оператор успокоен","good"],arrived:["Патруль на месте","bad"]};
  return `<div class="eyebrow">Давление ночи</div><h2>Часы угрозы</h2>
  ${w.length?`<div class="warns">${w.map((x,i)=>`<div class="warn ${x.c?"crit":""}" data-act="warn" data-v="${i}"><span class="ic">${x.c?"!!":"!"}</span><span>${esc(x.t)}</span></div>`).join("")}</div>`:`<p class="sub" style="margin:10px 0">Сейчас ничего не горит.</p>`}
  <h3>Игровое время</h3>
  <div class="bigtime">${fmt(S.time)}</div>
  <div class="progress"><i style="width:${Math.min(100,Math.max(0,(S.time-START_T)/span*100))}%"></i></div>
  <div class="sub" style="margin-bottom:8px">${left>0?"до открытия морга в 9:00 — "+dur(left):"Утренняя смена пришла"}</div>
  <div class="timebtns"><button class="btn" data-act="time" data-v="-5">−5</button><button class="btn" data-act="time" data-v="5">+5 мин</button><button class="btn" data-act="time" data-v="15">+15</button><button class="btn" data-act="time" data-v="30">+30</button><button class="btn" data-act="time" data-v="60">+1 ч</button><button class="btn sm" data-act="settime">Задать…</button></div>
  <h3>Отметки давления</h3>
  <p class="sub">Продвигайте за долгие споры, повторные неудачи, лечение, пожар или ожидание полиции — не за каждую комнату.</p>
  <div class="clocklist">${CLOCK.map((c,i)=>`<button class="cm ${S.mark===i+1?"on":S.mark>i+1?"past":""}" data-act="mark" data-v="${i+1}"><span class="k">${i+1}</span><span><b>${esc(c[0])}</b><small>${esc(c[1])}</small></span></button>`).join("")}</div>
  <h3>Состояние морга</h3>
  <div class="toggles">
    ${tg("light","Свет",n.light?"Горит":"Выключен",n.light?"good":"bad")}
    ${tg("furnace","Печь",n.furnace?"Работает":"Выключена",n.furnace?"good":"mid")}
    ${tg("armsFree","Электрощит",n.armsFree?"Во власти Рук":"Под контролем",n.armsFree?"bad":"good")}
    ${tg("door","Задняя дверь",{closed:"Прикрыта",open:"Открыта",blocked:"Заблокирована"}[n.door],n.door==="open"?"bad":n.door==="blocked"?"good":"mid")}
    ${tg("lift","Лифт",{locked:"Заперт",off:"Отключён",open:"Открыт"}[n.lift],n.lift==="open"?"mid":"good")}
    ${tg("call","Звонок Головы",callmap[n.call][0],callmap[n.call][1])}
    ${tg("warwick","Уорвик",wmap[n.warwick][0],wmap[n.warwick][1])}
    ${tg("alone","Уорвик один?",n.alone?"Да, без защиты":"Под присмотром",n.alone?"bad":"good")}
    ${tg("fire","Пожар",n.fire?"Горит!":"Нет",n.fire?"bad":"good")}
  </div>
  ${!n.light?readBlock([LIGHTS_OUT],"Когда гаснет свет"):`<div class="rowbtns"><button class="btn" data-act="lightsread">Зачитка «Когда гаснет свет»</button></div>`}
  <h3>Реакция морга</h3>
  <table class="t">${RULES.react.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>
  <h3>Время за столом</h3>
  <table class="t">${TIMELINE.map(t=>`<tr><td>${esc(t[0])}</td><td style="text-align:right;font-family:var(--mono)">${t[1]} мин</td></tr>`).join("")}</table>
  <div class="rowbtns" style="margin-top:24px"><button class="btn" data-act="reset">Сбросить ночь…</button></div>`;
}

function invCard(v,i){
  const nonV=PARTS.filter(p=>p.id!=="viscera"&&v.met[p.id]).length;
  const partImm=v.lp>=6,viscImm=v.lv>=6;
  const nextMax=Math.max(1,6-nonV);
  return `<div class="inv" id="inv-${i}"><div class="top">${i<4?`<span class="badge-inv" style="border-color:${PARTY_COL[i]};color:${PARTY_COL[i]}">${i+1}</span>`:""}<input class="name" id="inv-name-${i}" data-inv="${i}" data-f="name" value="${esc(v.name)}" aria-label="Имя сыщика">
  <span class="sanbox">SAN <input id="inv-san-${i}" type="number" data-inv="${i}" data-f="san" value="${v.san}" aria-label="SAN"></span>
  <button class="btn sm" data-act="delinv" data-v="${i}" aria-label="Удалить">✕</button></div>
  <div class="met">${PARTS.map(p=>`<button class="${v.met[p.id]?"on":""}" style="${v.met[p.id]?`border-color:${p.color};background:${p.color}33`:""}" data-act="met" data-i="${i}" data-v="${p.id}" title="Встречал(а): ${p.name}">${p.name}</button>`).join("")}</div>
  <div class="calc">След. новая часть: <b>${partImm?"иммунитет":"1/1D"+nextMax}</b> · Внутренности: <b>${v.met.viscera?(viscImm?"иммунитет":"1/1D6 (повторно)"):"1/1D6"}</b></div>
  <div class="calc" style="margin-top:6px;display:flex;gap:14px;flex-wrap:wrap">
    <span class="ctr">Потеряно от частей: <button data-act="lost" data-i="${i}" data-f="lp" data-v="-1">−</button>${v.lp}<button data-act="lost" data-i="${i}" data-f="lp" data-v="1">+</button></span>
    <span class="ctr">от Внутренностей: <button data-act="lost" data-i="${i}" data-f="lv" data-v="-1">−</button>${v.lv}<button data-act="lost" data-i="${i}" data-f="lv" data-v="1">+</button></span>
  </div></div>`;
}
function paneParty(){
  return `<div class="eyebrow">Сыщики</div><h2>Рассудок и встречи</h2>
  <p class="lead" style="margin-top:6px">Отмечайте, кого из частей видел каждый сыщик — калькулятор сам уменьшит бросок. «+» в счётчиках потерь также вычитает SAN.</p>
  <div style="margin-top:12px">${S.inv.map(invCard).join("")}</div>
  <div class="rowbtns"><button class="btn" data-act="addinv">+ Добавить сыщика</button><button class="btn" data-act="metall">Все присутствующие увидели…</button></div>
  <h3>Кости</h3>
  <div class="dice">${[["1D3",3],["1D4",4],["1D6",6],["1D8",8],["1D10",10],["1D100",100]].map(d=>`<button data-act="dice" data-v="${d[1]}">${d[0]}</button>`).join("")}<button data-act="dice" data-v="d6+1">1D6+1</button><button data-act="dice" data-v="d4+1">1D4+1</button><button data-act="dice" data-v="d4d4">1D4+1D4</button></div>
  <div class="dlog" id="dlog">Бросьте кость.</div>
  <h3>Полезные навыки</h3>
  <p class="sub">Первая помощь, Медицина, Наблюдательность, Слух, Скрытность, Электрика и боевые навыки. Отсутствие любого не должно делать задачу нерешаемой.</p>`;
}

function scene(s){
  const h=(s.handouts||[]).map(k=>`<button class="btn" data-act="handout" data-v="${k}">Хендаут: ${esc(HANDOUTS[k].title)}</button>`).join("");
  const hunt=s.hunt?`<div class="tscroll"><table class="t"><tr><th>Часть</th><th>Где</th><th>Статус</th></tr>${PARTS.map(p=>`<tr><td><a data-act="gopart" data-v="${p.id}" style="cursor:pointer;color:${p.color}">${p.name}</a></td><td><a data-act="room" data-v="${p.room}" style="cursor:pointer">${p.room} ${esc(ROOMS[p.room].name)}${p.id==="legs"?" / 07 / 09":""}</a></td><td><span class="stat s${S.parts[p.id].status}">${STATUS[S.parts[p.id].status]}</span></td></tr>`).join("")}</table></div>`:"";
  return `<details class="scene" id="${s.id}"><summary><span class="sn">${s.n}</span><span class="st">${esc(s.title)}</span><span class="tm">${s.time}</span></summary><div class="body">
  <p class="sub" style="font-style:normal"><b style="color:var(--parch)">Задача ведущего:</b> ${esc(s.task)}</p>
  ${s.read?readBlock(s.read,"Сцена "+s.n+". "+s.title):""}
  <ul class="plain">${s.notes.map(x=>`<li>${md(x)}</li>`).join("")}</ul>${hunt}
  <div class="rowbtns">${h}${s.room?`<button class="btn" data-act="room" data-v="${s.room}">Комната ${s.room}</button>`:""}</div>
  <div class="next">${esc(s.next)}</div></div></details>`;
}
function paneStory(){
  return `<div class="eyebrow">Одна ночь · 3–3,5 часа · 2–4 сыщика</div><h2>Маршрут сцен</h2>
  <p class="lead" style="margin-top:6px">Звонок → квартира → больница → раненый Уорвик → охота в выбранном порядке → уничтожение → побег и последствия.</p>
  <div style="margin-top:12px">${SCENES.map(scene).join("")}</div>
  <details class="scene" id="warwick"><summary><span class="sn">NPC</span><span class="st">Лоуренс Уорвик</span><span class="tm">${wLabel()}</span></summary><div class="body">
    <p>${esc(WARWICK.state)}</p>${readBlock(WARWICK.first,"Первое впечатление")}
    <p>${esc(WARWICK.know)}</p>
    <h4>Поведение</h4><table class="t">${WARWICK.behavior.map(b=>`<tr><td>${esc(b[0])}</td><td>${esc(b[1])}</td></tr>`).join("")}</table>
    <h4>Проверки</h4><div class="tscroll"><table class="t"><tr><th>Действие</th><th>Проверка</th><th>Успех</th><th>Провал</th></tr>${WARWICK.checks.map(c=>`<tr>${c.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</table></div>
    <div class="statline">${WARWICK.stats}</div><p class="sub">${esc(WARWICK.skills)}</p>
    <div class="rowbtns"><a class="btn" href="${obs("Персонажи/Лоуренс Уорвик")}">Открыть в Obsidian</a></div>
  </div></details>
  <details class="scene" id="s-end"><summary><span class="sn">∎</span><span class="st">Развязки и эпилог</span><span class="tm">10 мин</span></summary><div class="body">
    ${readBlock([FINALE_READ],"Последняя часть уничтожена")}
    <p>Сыщикам нужно быстро покинуть морг, чтобы избежать ареста за взлом и порчу имущества. Полиция врывается в ту же секунду — можно оборвать на клиффхэнгере. Пожар или тревога — покажите последствия для пациентов и персонала.</p>
    <table class="t">${OUTCOMES.map(o=>`<tr><td>${esc(o[0])}</td><td>${esc(o[1])}</td></tr>`).join("")}</table>
    <h4>После сессии</h4><ul class="plain"><li>Зафиксируйте судьбу Уорвика и последствия для больницы.</li><li>Если части не уничтожены — где и когда они восстановятся и на кого направят угрозу.</li><li>Пожар, тревога, задержание — последствия для пациентов, персонала и сыщиков.</li></ul>
  </div></details>
  <h3>Хендауты для игроков</h3>
  <div class="rowbtns">${Object.keys(HANDOUTS).map(k=>`<button class="btn pri" data-act="handout" data-v="${k}">${esc(HANDOUTS[k].title)}</button>`).join("")}</div>
  <h3>Выводы игроков и три источника</h3>
  <div class="tscroll"><table class="t"><tr><th>Вывод</th><th>Источник 1</th><th>Источник 2</th><th>Источник 3</th></tr>${CLUES.map(c=>`<tr>${c.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</table></div>
  <h3>Необратимые решения</h3>
  <div class="tscroll"><table class="t"><tr><th>Действие</th><th>Реакция мира</th><th>Цена</th></tr>${DECISIONS.map(c=>`<tr>${c.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</table></div>
  <h3>Если сцена буксует</h3>${trigList(STUCK)}
  <h3>Чек-лист ведущего</h3>${checklist()}
  <h3>Секрет ведущего</h3><details class="secret"><summary>Показать тайну тела</summary><p style="margin-top:8px">${esc(RULES.secret)}</p></details>
  <div class="rowbtns" style="margin-top:16px"><a class="btn" href="${obs("01 Гайд ведущего — Ночь")}">Гайд в Obsidian</a><a class="btn" href="${obs("00 Панель ведущего")}">Панель ведущего</a><a class="btn" href="${obs("Чек-лист ведущего")}">Чек-лист</a></div>`;
}
function wLabel(){return {dying:"умирает",stable:"стабилизирован",dead:"погиб",upstairs:"наверху"}[S.night.warwick]}
function checklist(){
  const auto=PARTS.map(p=>{const s=S.parts[p.id].status;return `<label class="${s===3?"done":""}"><input type="checkbox" disabled ${s===3?"checked":""}><span>${p.name} уничтожены окончательно <span class="auto">(${STATUS[s].toLowerCase()})</span></span></label>`}).join("");
  return CHECKLIST.map(([h,items],gi)=>`<h4>${esc(h)}</h4><div class="cl">${items.map((t,i)=>{const k=gi+"-"+i;return `<label class="${S.cl[k]?"done":""}"><input type="checkbox" id="cl-${k}" data-cl="${k}" ${S.cl[k]?"checked":""}><span>${esc(t)}</span></label>`}).join("")}${h==="Во время охоты"?auto:""}</div>`).join("");
}
function paneRules(){
  return `<div class="eyebrow">Справочник</div><h2>Правила ночи</h2>
  <div class="note" style="margin-top:12px">${esc(RULES.principle)}</div>
  <h3>Санити</h3><ul class="plain">${RULES.san.map(x=>`<li>${md(x)}</li>`).join("")}</ul>
  <h3>Восстановление</h3><ul class="plain">${RULES.regen.map(x=>`<li>${md(x)}</li>`).join("")}</ul>
  <h3>Способы уничтожения</h3><table class="t">${RULES.destroy.map(d=>`<tr><td>${esc(d[0])}</td><td>${esc(d[1])}</td></tr>`).join("")}</table>
  <h3 id="r-police">Если вмешалась полиция</h3>${trigList(RULES.police)}
  <h3>Как держать угрозу читаемой</h3><p>Перед нападением оставляйте сенсорный след: царапанье под дверью, отключение света, капли на плитке, телефонную трубку или резкий звук в коридоре.</p>
  <h3>Схема</h3><p>Из больницы лифт ведёт в подготовку тел (02). Служебный вход с рампы выходит в коридор (03) — центральный узел. Холодильная камера (05) открывается из кабинета (04). Печь (10) — рядом с комнатой обслуживания (06).</p>
  <h3>Горячие клавиши</h3><p class="sub" style="font-style:normal"><kbd>1</kbd>–<kbd>9</kbd>, <kbd>0</kbd> — комнаты 01–10 · <kbd>/</kbd> — поиск · <kbd>+</kbd> <kbd>−</kbd> — масштаб · <kbd>F</kbd> — вписать · <kbd>V</kbd> — сменить изображение · <kbd>Esc</kbd> — закрыть</p>
  <div class="rowbtns"><a class="btn" href="${obs("Локации/Морг Святой Марии")}">Морг в Obsidian</a><a class="btn" href="${obs("Материалы/Части и осколки")}">Части и осколки</a></div>`;
}
function renderPane(){
  const f={room:paneRoom,parts:paneParts,night:paneNight,party:paneParty,story:paneStory,rules:paneRules}[S.tab]||paneRoom;
  $("#pane").innerHTML=f();
}
function refreshPane(){const st=$("#pane").scrollTop;const open=[...document.querySelectorAll("#pane details[open]")].map(d=>d.id).filter(Boolean);renderPane();open.forEach(id=>{const d=document.getElementById(id);if(d)d.open=true});$("#pane").scrollTop=st;renderHeader();renderTabs()}
function all(){renderHeader();renderMap();renderTabs();renderPane()}

/* ---------- modals ---------- */
function modal(inner){closeModal();const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="sheet"><button class="close" data-act="close" aria-label="Закрыть">✕</button>${inner}</div>`;m.addEventListener("click",e=>{if(e.target===m)closeModal()});document.body.appendChild(m);m.querySelector(".close").focus()}
function closeModal(){document.querySelectorAll(".modal").forEach(m=>m.remove())}
function showHandout(k){const h=HANDOUTS[k];
  const body=h.kind==="news"?`<div class="news"><div class="mast">${esc(h.title)}</div><div class="date">Аркхем, Массачусетс · июль 1927</div><h6>${esc(h.head)}</h6>${h.body.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`:`<div class="notebook"><h6>${esc(h.head)}</h6>${h.body.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`;
  modal(body+`<details class="keepernote"><summary>Для ведущего</summary><p style="margin-top:6px">${esc(h.keeper)}</p></details>`)}

/* ---------- actions ---------- */
function setStatus(id,v){const s=S.parts[id],p=PART[id];s.status=v;
  if(v===2){s.hp=s.hp.map(()=>0);s.restAt=S.time;s.watched=false}
  if(v===1&&s.hp.every(h=>h===0))s.hp=p.limbs.map(l=>l[1]);
  if(v!==2)s.restAt=null;
  if(v===3){s.hp=s.hp.map(()=>0);toast(`${p.name} уничтожены`)}
}
function applyHp(id,i,d){const s=S.parts[id],max=PART[id].limbs[i][1];s.hp[i]=Math.max(0,Math.min(max,s.hp[i]+d));
  if(s.status<3){if(s.hp.every(h=>h===0)){if(s.status!==2){s.status=2;s.restAt=S.time;s.watched=false;toast(`${PART[id].name}: 0 HP — обездвижены, не уничтожены`)}}else if(s.status===2){s.status=1;s.restAt=null}else if(s.status===0)s.status=1}}
function regenPart(id){const s=S.parts[id];const r=roll(4);let left=r;
  for(let i=0;i<s.hp.length&&left>0;i++){const max=PART[id].limbs[i][1];const add=Math.min(max-s.hp[i],left);s.hp[i]+=add;left-=add}
  if(s.status===2){s.status=1;s.restAt=null}toast(`${PART[id].name}: 1D4 = <b>${r}</b> HP восстановлено`)}
function advance(m){S.time=Math.max(START_T-60,S.time+m);
  if(S.night.call==="called"&&S.night.policeAt!=null&&S.time>=S.night.policeAt){S.night.call="arrived";if(!S.tokens.police)S.tokens.police=[1935,620];toast("Патрульный у служебного входа")}
  PARTS.forEach(p=>{if(regenDue(p.id))toast(`${p.name}: пять минут покоя — пора восстанавливаться`)})}
let resetArm=0;
const pendingDmg={};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  switch(a){
    case "view":S.view=v;renderMap();if(v==="plan")fitTo(FIT);break;
    case "zoom":zoomAt(+v);break;
    case "fit":fitTo(FIT);break;
    case "page":fitTo(PAGE);break;
    case "room":selectRoom(v);break;
    case "poi":openPoi(v);break;
    case "center":{const r=ROOMS[S.room];const xs=r.poly.map(p=>p[0]),ys=r.poly.map(p=>p[1]);const x0=Math.min(...xs),y0=Math.min(...ys);fitTo({x:x0-120,y:y0-120,w:Math.max(...xs)-x0+240,h:Math.max(...ys)-y0+240});if(innerWidth<980)$("#mapwrap").scrollIntoView({behavior:"smooth"});break}
    case "visit":S.visited[S.room]=!S.visited[S.room];renderMap();refreshPane();break;
    case "found":setStatus(v,1);S.inv.forEach(x=>x.met[v]=true);toast(`${PART[v].name} обнаружены. Отмечено всем сыщикам — проверьте SAN во вкладке «Сыщики»`);renderMap();refreshPane();break;
    case "gopart":openToken(v);break;
    case "gowarwick":openToken("warwick");break;
    case "status":setStatus(b.dataset.p,+v);renderMap();refreshPane();break;
    case "hp":applyHp(b.dataset.p,+b.dataset.i,+v);renderMap();refreshPane();break;
    case "dmg":{const box=b.closest(".rowbtns");if(box.querySelector(".dmgq"))break;const qq=document.createElement("span");qq.className="dmgq";qq.style.cssText="display:flex;gap:4px;flex-wrap:wrap;width:100%";qq.innerHTML=[1,2,3,4,5,6,8,10].map(n=>`<button class="btn sm" data-act="dmgn" data-p="${v}" data-v="${n}">−${n}</button>`).join("");box.appendChild(qq);return}
    case "dmgn":{const s=S.parts[b.dataset.p];let d=+v;for(let i=0;i<s.hp.length&&d>0;i++){if(s.hp[i]>0){const t=Math.min(s.hp[i],d);applyHp(b.dataset.p,i,-t);d-=t;break}}renderMap();refreshPane();break}
    case "regen":case "regenany":regenPart(v);renderMap();refreshPane();break;
    case "watch":{const s=S.parts[v];s.watched=!s.watched;if(!s.watched)s.restAt=S.time;renderMap();refreshPane();break}
    case "time":advance(+v);renderMap();refreshPane();break;
    case "settime":{const box=b.parentElement;if(box.querySelector("input"))break;const inp=document.createElement("input");inp.type="time";inp.id="timeset";inp.value=fmt(S.time);inp.style.cssText="background:var(--panel);border:1px solid var(--line2);color:var(--text);border-radius:4px;padding:3px 6px";inp.addEventListener("change",()=>{const [h,m]=inp.value.split(":").map(Number);let t=h*60+m;if(t<12*60)t+=1440;S.time=t;save();refreshPane();renderMap()});box.appendChild(inp);inp.focus();break}
    case "mark":S.mark=S.mark===+v?+v-1:+v;if(+v===2&&S.mark===2&&S.night.armsFree){S.night.light=false;toast("Свет гаснет — Руки у щита")}renderMap();refreshPane();break;
    case "tg":{const n=S.night;
      if(v==="light")n.light=!n.light;else if(v==="furnace")n.furnace=!n.furnace;else if(v==="armsFree")n.armsFree=!n.armsFree;else if(v==="alone")n.alone=!n.alone;else if(v==="fire")n.fire=!n.fire;
      else if(v==="door")n.door={closed:"open",open:"blocked",blocked:"closed"}[n.door];
      else if(v==="lift")n.lift={locked:"off",off:"open",open:"locked"}[n.lift];
      else if(v==="warwick")n.warwick={dying:"stable",stable:"upstairs",upstairs:"dead",dead:"dying"}[n.warwick];
      else if(v==="call"){n.call={none:"called",called:"calm",calm:"arrived",arrived:"none"}[n.call];if(n.call==="called"){n.policeAt=S.time+30;toast("Патруль выедет: прибытие в "+fmt(n.policeAt))}if(n.call==="arrived"&&!S.tokens.police)S.tokens.police=[1935,620];if(n.call==="none"){n.policeAt=null;S.tokens.police=null}}
      renderMap();refreshPane();break}
    case "wstate":S.night.warwick=v;if(v==="dead")S.night.alone=false;toast("Уорвик: "+wLabel());renderMap();refreshPane();break;
    case "lightsread":modal(`<div class="reading"><h5>Когда гаснет свет</h5><p>${esc(LIGHTS_OUT)}</p></div>`);break;
    case "read":{const paras=JSON.parse(b.dataset.text);modal(`<div class="reading"><h5>${esc(b.dataset.title)}</h5>${paras.map(p=>`<p>${md(p)}</p>`).join("")}</div>`);break}
    case "handout":showHandout(v);break;
    case "close":closeModal();break;
    case "warn":{const w=warnings()[+v];if(!w)break;if(w.room)selectRoom(w.room);else if(w.part)openToken(w.part);else{S.tab=w.go;renderTabs();renderPane();if(w.anchor)setTimeout(()=>{const d=document.getElementById(w.anchor);if(d){if(d.tagName==="DETAILS")d.open=true;d.scrollIntoView({block:"start"})}},30)}break}
    case "met":{const x=S.inv[+b.dataset.i];x.met[v]=!x.met[v];refreshPane();break}
    case "metall":{const alive=PARTS.filter(p=>S.parts[p.id].status>0);S.inv.forEach(x=>alive.forEach(p=>x.met[p.id]=true));toast("Обнаруженные части отмечены у всех сыщиков");refreshPane();break}
    case "lost":{const x=S.inv[+b.dataset.i];const f=b.dataset.f;const d=+v;const nv=Math.max(0,x[f]+d);if(nv!==x[f]){x[f]=nv;x.san=Math.max(0,x.san-d)}refreshPane();break}
    case "addinv":S.inv.push({name:"Сыщик "+(S.inv.length+1),san:50,lp:0,lv:0,met:{}});refreshPane();break;
    case "delinv":S.inv.splice(+v,1);refreshPane();break;
    case "dice":{let r,t;if(v==="d6+1"){r=roll(6)+1;t="1D6+1"}else if(v==="d4+1"){r=roll(4)+1;t="1D4+1"}else if(v==="d4d4"){const a1=roll(4),a2=roll(4);r=a1+a2;t=`1D4+1D4 (${a1}+${a2})`}else{r=roll(+v);t="1D"+v}
      const d=$("#dlog");if(d)d.innerHTML=`${t} → <b>${r}</b>`;break}
    case "reset":if(Date.now()-resetArm<3000){S=fresh();try{localStorage.removeItem(KEY)}catch(e){}all();fitTo(FIT);toast("Ночь сброшена")}else{resetArm=Date.now();b.textContent="Нажмите ещё раз для сброса";b.classList.add("pri");setTimeout(()=>{if(b.isConnected){b.textContent="Сбросить ночь…";b.classList.remove("pri")}},3000);return}break;
  }
  save();renderHeader();
});
$("#alertBadge").addEventListener("click",()=>{S.tab="night";save();renderTabs();renderPane();$("#pane").scrollTop=0});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.tab=b.dataset.tab;S.focusPart=null;save();renderTabs();renderPane();$("#pane").scrollTop=0});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.cl){S.cl[t.dataset.cl]=t.checked;t.closest("label").classList.toggle("done",t.checked);save()}
  if(t.dataset.inv!=null){const x=S.inv[+t.dataset.inv];if(t.dataset.f==="san")x.san=parseInt(t.value,10)||0;else{x.name=t.value;renderMap()}save()}
  if(t.id==="lTokens"||t.id==="lPois"||t.id==="lLabels"){S.layers={tokens:$("#lTokens").checked,pois:$("#lPois").checked,labels:$("#lLabels").checked};save();renderMap()}
});

/* ---------- search ---------- */
const IDX=[];
(function buildIndex(){
  const add=(title,ctx,text,go)=>IDX.push({title,ctx,text:(title+" "+text).toLowerCase(),go});
  for(const id in ROOMS){const r=ROOMS[id];const ch=(r.shared?STAFF_SHARED.checks:r.checks||[]);const tr=(r.shared?STAFF_SHARED.triggers:r.triggers||[]);
    add(`${id} ${r.name}`,"Комната",[r.en,r.why,...r.read,...r.actions,...ch.flat(),...tr,r.note||""].join(" "),{room:id});
    ch.forEach(c=>add(`${c[0]||"Проверка"} — ${r.name}`,`Комната ${id}`,c[1],{room:id}));}
  PARTS.forEach(p=>add(p.name,"Часть тела",[p.goal,p.knows,p.react,p.appear,p.tactics,p.stats,p.derived,p.attacks.join(" "),p.skills,p.special,p.checks.flat().join(" ")].join(" "),{part:p.id}));
  POIS.forEach(p=>add(p.name,"Объект · "+p.room,p.text,{poi:p.id}));
  SCENES.forEach(s=>add(`Сцена ${s.n}. ${s.title}`,"Сценарий",[s.task,...(s.read||[]),...s.notes].join(" "),{anchor:s.id,tab:"story"}));
  add("Лоуренс Уорвик","NPC",[WARWICK.state,WARWICK.know,WARWICK.stats,WARWICK.checks.flat().join(" ")].join(" "),{anchor:"warwick",tab:"story"});
  Object.keys(HANDOUTS).forEach(k=>add(HANDOUTS[k].title,"Хендаут",HANDOUTS[k].body.join(" ")+" "+HANDOUTS[k].keeper,{handout:k}));
  add("Санити (SAN)","Правила",RULES.san.join(" "),{tab:"rules"});
  add("Уничтожение: печь, огонь, бензин, химия","Правила",RULES.destroy.flat().join(" "),{tab:"rules"});
  add("Полиция и патрульный","Правила",RULES.police.join(" "),{tab:"rules",anchor:"r-police"});
  add("Развязки и эпилог","Сценарий",FINALE_READ+" "+OUTCOMES.flat().join(" "),{anchor:"s-end",tab:"story"});
  add("Когда гаснет свет","Зачитка",LIGHTS_OUT,{lights:1});
})();
const q=$("#q"),res=$("#results");let hits=[],hi=0;
function snippet(text,term){const i=text.indexOf(term);if(i<0)return "";return (i>30?"…":"")+text.slice(Math.max(0,i-30),i+70)}
q.addEventListener("input",()=>{const t=q.value.trim().toLowerCase();if(t.length<2){res.hidden=true;return}
  const terms=t.split(/\s+/);hits=IDX.filter(x=>terms.every(w=>x.text.includes(w))).slice(0,14);hi=0;
  res.innerHTML=hits.length?hits.map((h,i)=>`<button class="${i===0?"act":""}" data-hit="${i}"><b>${esc(h.title)}</b> <span style="color:var(--faint);font-size:11px">${esc(h.ctx)}</span><span class="ctx">${esc(snippet(h.text,terms[0]))}</span></button>`).join(""):`<div style="padding:10px;color:var(--muted)">Ничего не найдено</div>`;res.hidden=false});
function goHit(h){res.hidden=true;q.value="";q.blur();const g=h.go;
  if(g.room)selectRoom(g.room);else if(g.part)openToken(g.part);else if(g.poi)openPoi(g.poi);else if(g.handout)showHandout(g.handout);else if(g.lights)$("[data-act=lightsread]")?.click();
  else{S.tab=g.tab;renderTabs();renderPane();if(g.anchor)setTimeout(()=>{const d=document.getElementById(g.anchor);if(d){if(d.tagName==="DETAILS")d.open=true;d.scrollIntoView({block:"start"})}},30)}save()}
res.addEventListener("click",e=>{const b=e.target.closest("[data-hit]");if(b)goHit(hits[+b.dataset.hit])});
q.addEventListener("keydown",e=>{if(!hits.length||res.hidden)return;if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();hi=(hi+(e.key==="ArrowDown"?1:-1)+hits.length)%hits.length;res.querySelectorAll("button").forEach((b,i)=>b.classList.toggle("act",i===hi))}if(e.key==="Enter"){e.preventDefault();goHit(hits[hi])}if(e.key==="Escape"){res.hidden=true;q.blur()}});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))res.hidden=true});

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeModal();return}
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||document.querySelector(".modal"))return;
  if(e.key==="/"){e.preventDefault();q.focus();return}
  if(/^[0-9]$/.test(e.key)){selectRoom(e.key==="0"?"10":"0"+e.key);return}
  if(e.key==="+"||e.key==="=")zoomAt(1.25);else if(e.key==="-")zoomAt(0.8);else if(e.key==="f"||e.key==="F"||e.key==="а"||e.key==="А")fitTo(FIT);
  else if(e.key==="v"||e.key==="V"||e.key==="м"||e.key==="М"){S.view=S.view==="orig"?"plan":"orig";save();renderMap()}
});

/* ---------- init ---------- */
buildRooms();buildPois();all();
requestAnimationFrame(()=>fitTo(FIT));
addEventListener("resize",()=>{const cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;fitTo({x:cx-vb.w/2,y:cy-vb.h/2,w:vb.w,h:vb.h})});
})();
</script>

</body>
